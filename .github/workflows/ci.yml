# 只是 Actions 列表里的显示名。required check 认的是下面 job 的 name，不是它——两者刻意取不同值，
# 免得有人改了显示名却以为换了门禁。
name: gate

# 单触发：只在 PR 上跑。有意接受的缺口——strict=false，base 落后于 main 时，
# 真正落进 main 的那个合并结果没有被任何一次运行跑过。
# types 里带上 ready_for_review：draft PR 转正式时若没有新 commit，默认三种类型都不会触发，
# required check 会一直停在 Expected，而 enforce_admins=true 之下谁都出不去。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    # required check 认的是这个名字，改它等于换门禁（见 .github/branch-protection.json）。
    name: ci
    # ubuntu-latest 会在无人签核的情况下换代（GitHub 已公告迁移到 Ubuntu 26）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
