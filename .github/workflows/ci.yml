name: ci

# 单触发：只在 PR 上跑。有意接受的缺口——strict=false，base 落后于 main 时，
# 真正落进 main 的那个合并结果没有被任何一次运行跑过。
on: pull_request

permissions:
  contents: read

jobs:
  ci:
    # required check 认的是这个名字，改它等于换门禁（见 .github/branch-protection.json）。
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
